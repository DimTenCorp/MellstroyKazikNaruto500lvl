<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>$GODOT_PROJECT_NAME</title>
        <script>
        // Анлок аудио: перехватываем создание AudioContext до старта движка
        // и будим все контексты по первому жесту пользователя (autoplay policy).
        (function () {
            window.__acs = [];
            var Orig = window.AudioContext || window.webkitAudioContext;
            if (Orig) {
                window.AudioContext = function (opts) {
                    var c = new Orig(opts);
                    window.__acs.push(c);
                    return c;
                };
                window.AudioContext.prototype = Orig.prototype;
                window.webkitAudioContext = window.AudioContext;
            }
            window.__unlockAudio = function () {
                (window.__acs || []).forEach(function (c) {
                    try { if (c.state !== "running") { c.resume(); } } catch (e) {}
                });
            };
            ["pointerdown", "touchstart", "keydown", "click"].forEach(function (ev) {
                window.addEventListener(ev, window.__unlockAudio,
                        { capture: true, passive: true });
            });
        })();
        </script>
        <style>
            html, body, #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                color: white;
                background-color: black;
                overflow: hidden;
                touch-action: none;
            }

            #canvas {
                display: block;
            }

            #canvas:focus {
                outline: none;
            }

            /* правая колонка под стики-баннер: канвас её не занимает */
            :root { --sbw: clamp(70px, 10vw, 160px); }
            #canvas {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                right: var(--sbw);
                width: auto;
                height: auto;
            }
            #sticky-banner {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: var(--sbw);
                overflow: hidden;
                z-index: 40;
            }
            #sticky-banner * {
                position: static !important;
                left: auto !important;
                top: auto !important;
                bottom: auto !important;
                width: 100% !important;
                max-width: 100% !important;
            }

            #status, #status-splash, #status-progress {
                position: absolute;
                left: 0;
                right: 0;
            }

            #status, #status-splash {
                top: 0;
                bottom: 0;
            }

            #status {
                background-color: #242424;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                visibility: hidden;
            }

            #status-splash {
                max-height: 100%;
                max-width: 100%;
                margin: auto;
            }

            #status-progress, #status-notice {
                display: none;
            }

            #status-progress {
                bottom: 10%;
                width: 50%;
                margin: 0 auto;
            }

            #status-notice {
                background-color: #5b3943;
                border-radius: 0.5rem;
                border: 1px solid #9b3943;
                color: #e0e0e0;
                font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
                line-height: 1.3;
                margin: 0 2rem;
                overflow: hidden;
                padding: 1rem;
                text-align: center;
                z-index: 1;
            }

        </style>
        $GODOT_HEAD_INCLUDE
    </head>
    <body>
        <canvas id="canvas">
            Your browser does not support the canvas tag.
        </canvas>
        <div id="sticky-banner"></div>

        <noscript>
            Your browser does not support JavaScript.
        </noscript>

        <div id="status">
            <img id="status-splash" src="$GODOT_SPLASH" alt="">
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>

        <script src="$GODOT_URL"></script>
        <script>
            const GODOT_CONFIG = $GODOT_CONFIG
            const ENGINE = new Engine(GODOT_CONFIG)
            const CANVAS = document.getElementById('canvas')

            let bridgeScript = null
            let bridgeTimeout = null
            let bridgeLoaded = false

            function addLocalBridge() {
                if (bridgeLoaded) return
                bridgeLoaded = true
                clearTimeout(bridgeTimeout)

                if (bridgeScript && bridgeScript.parentNode) {
                    bridgeScript.onload = null
                    bridgeScript.onerror = null
                    bridgeScript.parentNode.removeChild(bridgeScript)
                }

                window.bridge = null
                window.playgamaBridge = null

                const scriptElement = document.createElement('script')
                scriptElement.src = './playgama-bridge.js'
                scriptElement.onload = function() {
                    initializeBridge()
                }
                document.body.appendChild(scriptElement)
            }

            bridgeScript = document.createElement('script')
            bridgeScript.src = 'https://bridge.playgama.com/v2/stable/playgama-bridge.js'
            bridgeScript.onload = initializeBridge
            bridgeScript.onerror = addLocalBridge

            bridgeTimeout = setTimeout(() => {
                console.warn('CDN bridge failed to load within 2 seconds, loading local bridge')
                addLocalBridge()
            }, 2000)

            document.head.appendChild(bridgeScript)

            function initializeBridge() {
                clearTimeout(bridgeTimeout)
                bridge.engine = 'godot-4'
                bridge.initialize().then(() => {
                    bridge.setGameLoadingProgress(0)
                    ENGINE.startGame({
                        onProgress: function (current, total) {
                            bridge.setGameLoadingProgress((current / total) * 100);
                        },
                    }).then(() => {
                        CANVAS.focus()
                    });
                })
            }
        </script>

        <script>
            /* Переносим баннер платформы в правую колонку, чтобы он не
               закрывал игру: ловим новые узлы и вытаскиваем fixed-блоки. */
            (function () {
                var host = document.getElementById('sticky-banner');
                if (!host) { return; }
                function mark(el) {
                    var cls = (typeof el.className === 'string') ? el.className : '';
                    return ((el.id || '') + ' ' + cls + ' ' + (el.src || '')).toLowerCase();
                }
                function looks(el) {
                    return /banner|sticky|advert|adv-|\/adv|yandex|game-ad/.test(mark(el));
                }
                function adopt(el) {
                    if (!el || el === host || host.contains(el)) { return; }
                    host.appendChild(el);
                }
                new MutationObserver(function (muts) {
                    muts.forEach(function (m) {
                        m.addedNodes.forEach(function (n) {
                            if (n.nodeType === 1 && looks(n)) { adopt(n); }
                        });
                    });
                }).observe(document.body, { childList: true, subtree: true });
                setInterval(function () {
                    var nodes = document.querySelectorAll('body iframe, body div');
                    for (var i = 0; i < nodes.length; i++) {
                        var el = nodes[i];
                        if (host.contains(el)) { continue; }
                        var cs = getComputedStyle(el);
                        if (cs.position === 'fixed' && looks(el)) { adopt(el); }
                    }
                }, 1500);
            })();
        </script>
    </body>
</html>
